databases:
  - name: rameerder-db
    databaseName: rameerder_db
    user: rameerder_user
    plan: free
    region: frankfurt

services:

  # ==========================================
  # FASTAPI BACKEND
  # ==========================================
  - type: web
    name: rameerder-backend
    runtime: python
    region: frankfurt
    plan: free

    rootDir: rameerder-backend

    buildCommand: pip install -r requirements.txt

    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

      - key: DATABASE_URL
        fromDatabase:
          name: rameerder-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

      - key: BACKEND_CORS_ORIGINS
        value: '["https://rameerder-frontend.onrender.com","http://localhost:5173"]'


  # ==========================================
  # REACT FRONTEND
  # ==========================================
  - type: web
    name: rameerder-frontend
    runtime: static
    rootDir: rameerder-frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://rameerder-backend.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

